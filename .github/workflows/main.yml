name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-cyrillic fonts-noto-core

      - name: Build both CVs
        run: ./compile

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdfs
          path: |
            build/RomanDugaev_CV_eng.pdf
            build/RomanDugaev_CV_rus.pdf
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cv-pdfs
          path: build

      - name: Attach PDFs to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/RomanDugaev_CV_eng.pdf \
            build/RomanDugaev_CV_rus.pdf --clobber
